version: '3.8'

services:
  jvm-graph-service:
    build:
      context: ./services/jvm-graph-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  node-api-gateway:
    build:
      context: ./services/node-api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - JVM_GRAPH_SERVICE_URL=http://jvm-graph-service:8081
      - AZURE_ENTRA_TENANT_ID=common
    depends_on:
      jvm-graph-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LLMOps & Evaluation Observability (Arize Phoenix & MLflow)
  mlflow-tracking-server:
    image: ghcr.io/mlflow/mlflow:v2.15.0
    ports:
      - "5001:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    volumes:
      - ./data/mlflow:/mlflow
    restart: unless-stopped

  arize-phoenix-server:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    environment:
      - PHOENIX_PORT=6006
      - PHOENIX_HOST=0.0.0.0
    restart: unless-stopped

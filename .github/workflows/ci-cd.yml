name: Azure Enterprise Insurance GraphRAG CI/CD

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  test-jvm-service:
    name: Build & Test JVM Knowledge Graph Microservice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run JVM Unit/Integration Tests
        working-directory: services/jvm-graph-service
        run: mvn clean test

  test-node-gateway:
    name: Build & Test Node.js Gateway Microservice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/node-api-gateway/package.json

      - name: Install Dependencies
        working-directory: services/node-api-gateway
        run: npm ci

      - name: TypeScript Compile Check
        working-directory: services/node-api-gateway
        run: npx tsc --noEmit

      - name: Run Gateway Test Suite
        working-directory: services/node-api-gateway
        run: npm test

  llmops-eval-gate:
    name: Arize Phoenix & MLflow Hallucination & Groundedness Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/llmops-eval/requirements.txt

      - name: Install LLMOps Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/llmops-eval/requirements.txt

      - name: Run Arize Phoenix & MLflow Benchmark Evals
        working-directory: services/llmops-eval
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
          EVAL_GROUNDEDNESS_THRESHOLD: "0.80"
          EVAL_MAX_HALLUCINATION_RATE: "0.10"
        run: |
          python -m pytest test_eval.py
          python run_eval.py

      - name: Upload MLflow Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-eval-db
          path: services/llmops-eval/mlflow.db
          retention-days: 7

  validate-azure-iac:
    name: Validate Azure Infrastructure as Code (Bicep & Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Serverless Bicep Template
        run: |
          az bicep build --file infra/bicep/serverless.bicep
          az bicep build --file infra/bicep/main.bicep

  build-and-push-images:
    name: Build & Publish Containers to GitHub Container Registry (ghcr.io)
    needs: [test-jvm-service, test-node-gateway, llmops-eval-gate, validate-azure-iac]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name for Image Tags
        id: repo_downcase
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build & Push JVM Knowledge Graph Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/jvm-graph-service
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/jvm-graph-service:latest

      - name: Build & Push Node.js API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/node-api-gateway
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/node-api-gateway:latest

  deploy-azure:
    name: Deploy to Azure Container Apps
    needs: [build-and-push-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Azure Credentials
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "Notice: Azure credentials (AZURE_CLIENT_ID) are not configured in GitHub Secrets. Skipping Azure deployment."
            echo "DEPLOY_ENABLED=false" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENABLED=true" >> $GITHUB_ENV
          fi

      - name: Azure OIDC Login
        if: env.DEPLOY_ENABLED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Downcase Repository Name for Image Tags
        if: env.DEPLOY_ENABLED == 'true'
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Deploy Serverless Infrastructure (Bicep)
        if: env.DEPLOY_ENABLED == 'true'
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: infra/bicep/serverless.bicep
          parameters: >-
            infra/bicep/serverless.parameters.json
            jvmImage=${{ env.IMAGE_PREFIX }}/jvm-graph-service:latest
            nodeImage=${{ env.IMAGE_PREFIX }}/node-api-gateway:latest
